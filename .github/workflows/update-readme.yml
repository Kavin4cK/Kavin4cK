name: Dynamic README Update

on:
  schedule:
    - cron: '30 * * * *'   # every 30 min (UTC) — offset from the hour to avoid congestion
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: readme-update
  cancel-in-progress: true   # a stuck run can no longer block every run after it

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # hard stop so a hung step can't jam the queue
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        env:
          TZ: 'Asia/Kolkata'
        run: |
          set -e

          GREETING="Greetings :)"
          EMOJI="👋"
          COLOR="00F74D"
          MSG="Welcome to my profile!"

          FULL_DATE=$(date '+%A, %B %d, %Y')
          FULL_TIME=$(date '+%I:%M %p IST')

          # ---------- random quote ----------
          QUOTES=(
            "Code is like humor. When you have to explain it, it's bad."
            "First, solve the problem. Then, write the code."
            "The best error message is the one that never shows up."
            "Clean code always looks like it was written by someone who cares."
            "Make it work, make it right, make it fast."
            "Talk is cheap. Show me the code."
          )
          QUOTE="${QUOTES[$((RANDOM % ${#QUOTES[@]}))]}"

          # ---------- build the new blocks ----------
          cat > /tmp/header.md <<EOF
          <div align="center">

          # $GREETING

          ![Wave](https://capsule-render.vercel.app/api?type=waving&color=$COLOR&height=120&section=header&text=$EMOJI&fontSize=90&animation=twinkling)

          ### 🕐 Last Updated: $FULL_DATE at $FULL_TIME

          *$MSG*

          </div>
          EOF

          cat > /tmp/quote.md <<EOF
          <div align="center">

          > *"$QUOTE"*

          </div>
          EOF

          # ---------- swap the content between the markers ----------
          replace_block() {
            awk -v name="$1" -v file="$2" '
              { line=$0; sub(/\r$/, "", line) }
              line == "<!--START:" name "-->" {
                print line
                while ((getline l < file) > 0) print l
                close(file)
                skip=1
                next
              }
              line == "<!--END:" name "-->" { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
          }

          replace_block HEADER /tmp/header.md
          replace_block QUOTE /tmp/quote.md

          echo "Updated: $GREETING | $FULL_DATE at $FULL_TIME"

      - name: Commit changes
        env:
          TZ: 'Asia/Kolkata'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COMMIT_TIME=$(date '+%Y-%m-%d %I:%M %p IST')
            git commit -m "🤖 Update: Dynamic content [$COMMIT_TIME]"
            git push
          fi
